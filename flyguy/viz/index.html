<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyguy brain</title>
<style>
  :root { --ink: #dfe7ff; --dim: #7f8bb0; --line: rgba(160, 180, 255, .18); }
  html, body { margin: 0; height: 100%; background: #02030a; color: var(--ink); overflow: hidden;
               font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; transition: opacity .25s; }
  body.clean .hud, body.burned .hud, body.bare .hud { opacity: 0; }     /* burned: the words are drawn into the picture instead (stacked view); bare: nothing but the pictures (H) */
  body.nocredit #credit { display: none; }
  #gear { position: fixed; right: 14px; bottom: 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(8, 10, 22, .7);
          color: var(--dim); font-size: 17px; line-height: 28px; text-align: center; cursor: pointer; user-select: none; transition: opacity .25s; }
  #gear:hover { color: var(--ink); border-color: #7f8bb0; }
  body.bare #gear { opacity: 0; pointer-events: none; }
  #menu { position: fixed; right: 14px; top: 14px; bottom: 50px; width: 372px; max-width: calc(100vw - 28px); overflow-y: auto; display: none; box-sizing: border-box;
          padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(6, 8, 18, .93); backdrop-filter: blur(6px); }
  #menu.open { display: block; }
  #menu h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  #menu h3 { margin: 15px 0 5px; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #8fa0d8; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #menu .set { display: grid; grid-template-columns: 1fr 150px; gap: 10px; align-items: center; min-height: 27px; }
  #menu .set label { color: var(--ink); }
  #menu .set kbd, #menu .hint kbd { font: 11px "Segoe UI", system-ui, sans-serif; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 5px; }
  #menu .hint { color: var(--dim); font-size: 12px; margin: 1px 0 5px; }
  #menu select, #menu button { width: 100%; background: #0d1124; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  #menu button { cursor: pointer; } #menu button:hover { border-color: #7f8bb0; }
  #menu .rng { display: grid; grid-template-columns: 1fr 54px; gap: 6px; align-items: center; }
  #menu .rng span { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #menu input[type=range] { width: 100%; accent-color: #8fa0ff; margin: 0; }
  #menu input[type=checkbox] { justify-self: end; width: 16px; height: 16px; accent-color: #8fa0ff; }
  #menu .off { opacity: .4; pointer-events: none; }
  #menu .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  @media (max-width: 520px) { #menu { overflow-x: hidden; } #menu .set { grid-template-columns: 1fr; gap: 2px; margin: 6px 0; } #menu input[type=checkbox] { justify-self: start; } }
  #title { left: 22px; top: 18px; }
  #title h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .5px; }
  #title p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  #state { right: 22px; top: 20px; text-align: right; color: var(--dim); }
  #state b { color: var(--ink); font-weight: 600; }
  #layers { left: 22px; bottom: 44px; min-width: 300px; }
  .row { display: grid; grid-template-columns: 118px 1fr 92px; gap: 8px; align-items: center; margin: 3px 0; }
  .bar { height: 7px; background: rgba(255, 255, 255, .07); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 4px; }
  .row span:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  #total { margin-top: 7px; color: var(--dim); }
  #total b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #ctl { right: 22px; bottom: 44px; width: 250px; }
  #ctl .axis { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; margin: 4px 0; }
  .mid { position: relative; height: 8px; background: rgba(255, 255, 255, .07); border-radius: 4px; }
  .mid i { position: absolute; top: 0; height: 100%; background: #ffb066; border-radius: 4px; }
  .mid:after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 12px; background: var(--line); }
  .lamps { display: flex; gap: 6px; margin-top: 8px; }
  .lamp { flex: 1; text-align: center; padding: 3px 0; border: 1px solid var(--line); border-radius: 5px; color: var(--dim); }
  .lamp.on { background: #ff9a3d; border-color: #ffb066; color: #1a0d00; font-weight: 600; text-shadow: none; }
  #legend { left: 22px; top: 92px; color: var(--dim); }
  #legend div { margin: 2px 0; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
  #credit { left: 0; right: 0; bottom: 14px; text-align: center; color: var(--dim); font-size: 12px; }
  #keys { right: 22px; top: 64px; text-align: right; color: #56608a; font-size: 12px; }
  #rec { color: #ff5c5c; font-weight: 600; display: none; }
  @media (max-width: 1000px) {            /* a narrow window: the panels must not run into each other */
    #keys, #legend { display: none; }
    #title h1 { font-size: 20px; }
    #layers { min-width: 0; width: 42%; }
    .row { grid-template-columns: 1fr; gap: 2px; margin: 5px 0; }
    .row span:last-child { display: none; }
    #ctl { width: 40%; }
    #credit { font-size: 10px; bottom: 6px; }
    #layers, #ctl { bottom: 40px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title"><h1>Flyguy</h1><p>a fruit fly's wiring, playing Rocket League</p></div>
<div class="hud" id="legend"></div>
<div class="hud" id="state"><span id="rec">&#9679; recording &nbsp;</span><b id="live">connecting</b><br><span id="rate"></span><br><span id="bodystate"></span></div>
<div class="hud" id="keys">drag: turn &nbsp; wheel: zoom &nbsp; <b style="color:#8791bd">O settings</b> &nbsp; H hide everything<br>F full screen &nbsp; V record video &nbsp; M layout &nbsp; T fly pinned / on the floor</div>
<div class="hud" id="layers"></div>
<div class="hud" id="ctl">
  <div class="axis"><span>throttle</span><div class="mid"><i id="thr"></i></div></div>
  <div class="axis"><span>steer</span><div class="mid"><i id="str"></i></div></div>
  <div class="axis"><span>pitch</span><div class="mid"><i id="pit"></i></div></div>
  <div class="axis"><span>roll</span><div class="mid"><i id="rol"></i></div></div>
  <div class="lamps"><div class="lamp" id="jmp">jump</div><div class="lamp" id="bst">boost</div><div class="lamp" id="hbk">slide</div></div>
</div>
<div class="hud" id="credit"></div>
<div id="gear" title="Settings (O)">&#9881;</div>
<div id="menu"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) document.body.innerHTML = "<p style='padding:30px'>This page needs WebGL 2.</p>";
// Options in the address (for recordings):  ?view=brain|both|stack|body  &size=640x1080 (the picture's exact size, whatever the
// window's)  &clean=1 (no panels)  &autorec=1 (records every match by itself; the server keeps the files)  &labels=0|1
// (title, match clock and credit drawn INTO the picture - on by default in the stacked view, the one made to sit beside a game video)
const Q = new URLSearchParams(location.search);
const FIXED = (() => { const s = (Q.get("size") || "").split("x").map(Number); return s.length === 2 && s[0] > 0 && s[1] > 0 ? s : null; })();
// ---- settings: one list, kept in this browser (the menu: O or the wheel in the corner; most also have a key). What the
// address says wins for this visit and is not kept. The fly body's own settings live in its server (flyguy/body/
// body_server.py /set): null here = whatever that server runs with; a value the menu changed is sent again on every visit.
const DEF = { view: "", rotate: true, edges: true, slow: false, exposure: 1.25,
              panels: true, words: "auto", credit: true, bare: false, autorec: false,
              interp: true, camWide: 2.2, camCalm: 2.5,
              smooth: null, speed: null, tau: null, strength: null, wing: null, gain: null, soft: null };
const BODY_KEYS = ["smooth", "speed", "tau", "strength", "wing", "gain", "soft"];
const S = Object.assign({}, DEF), NOT_KEPT = new Set();
try { const o = JSON.parse(localStorage.getItem("flyguy_viz") || "{}"); for (const k in DEF) if (k in o) S[k] = o[k]; } catch (e) {}
function fromAddress(k, v) { S[k] = v; NOT_KEPT.add(k); }
if (Q.get("view")) fromAddress("view", Q.get("view"));
if (Q.get("clean") === "1") fromAddress("panels", false);
if (Q.get("bare") === "1") fromAddress("bare", true);
if (Q.get("labels")) fromAddress("words", Q.get("labels") === "1" ? "on" : "off");
if (Q.get("autorec") === "1") fromAddress("autorec", true);
if ((FIXED || Q.get("autorec") === "1") && Q.get("bare") !== "1") fromAddress("bare", false);      // (a recording page never starts hidden by an old choice)
function keep() { try { const o = {}; for (const k in DEF) if (!NOT_KEPT.has(k)) o[k] = S[k]; localStorage.setItem("flyguy_viz", JSON.stringify(o)); } catch (e) {} }
function fit() {
  if (!FIXED) return;
  const k = Math.min(innerWidth / FIXED[0], innerHeight / FIXED[1]), s = canvas.style;
  s.width = FIXED[0] * k + "px"; s.height = FIXED[1] * k + "px"; s.left = (innerWidth - FIXED[0] * k) / 2 + "px"; s.top = (innerHeight - FIXED[1] * k) / 2 + "px";
  s.right = "auto"; s.bottom = "auto";
}
addEventListener("resize", fit); fit();

const VS_P = `#version 300 es
in vec3 aPos; in vec3 aCol; in float aGlow; in float aFlag;
uniform mat4 uMVP; uniform float uSize;
out vec3 vCol; out float vGlow; out float vPlay;
void main() {
  vec4 p = uMVP * vec4(aPos, 1.0);
  gl_Position = p;
  vPlay = mod(aFlag, 2.0);
  vGlow = aGlow; vCol = aCol;
  gl_PointSize = uSize * (0.7 + 0.3 * vPlay + 2.8 * aGlow) / p.w;
}`;
const FS_P = `#version 300 es
precision mediump float;
in vec3 vCol; in float vGlow; in float vPlay;
out vec4 o;
void main() {
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d);
  if (r2 > 0.25) discard;
  float fall = exp(-r2 * 13.0);
  vec3 rest = vCol * mix(0.010, 0.040, vPlay);
  vec3 hot = mix(vCol, vec3(1.0), 0.45 * vGlow * vGlow) * (0.12 + 1.5 * vGlow) * vGlow;
  o = vec4((rest + hot) * fall, 1.0);
}`;
const VS_L = `#version 300 es
in vec3 aPos; in vec3 aCol; in float aI;
uniform mat4 uMVP;
out vec3 vCol;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); vCol = aCol * aI; }`;
const FS_L = `#version 300 es
precision mediump float;
in vec3 vCol; out vec4 o;
void main() { o = vec4(vCol, 1.0); }`;

const VS_T = `#version 300 es
out vec2 vUv;
void main() { vUv = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(vUv * 2.0 - 1.0, 0.0, 1.0); }`;
const FS_T = `#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex; uniform float uExposure;
out vec4 o;
void main() {      // the light of many neurons adds up far past white: fold it back, with a soft halo from the coarser levels
  vec3 c = textureLod(uTex, vUv, 0.0).rgb + 0.30 * textureLod(uTex, vUv, 2.5).rgb + 0.22 * textureLod(uTex, vUv, 4.5).rgb + 0.12 * textureLod(uTex, vUv, 6.5).rgb;
  c = vec3(1.0) - exp(-c * uExposure);
  o = vec4(pow(c, vec3(0.92)), 1.0);
}`;
// ---- the fly body (flyguy/body/body_server.py): every mesh of the flybody model, placed where the physics has it
const VS_B = `#version 300 es
in vec3 aPos; in vec3 aNor;
uniform mat4 uVP; uniform vec3 uT; uniform mat3 uR;
out vec3 vW; out vec3 vN; out vec3 vL;
void main() {
  vec3 w = uR * aPos + uT;
  vW = w; vN = uR * aNor; vL = aPos;
  gl_Position = uVP * vec4(w, 1.0);
}`;
const FS_B = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec3 vL;
uniform vec4 uCol; uniform vec3 uEye; uniform int uKind;
out vec4 o;
void main() {
  vec3 N = normalize(vN), V = normalize(uEye - vW);
  if (!gl_FrontFacing) N = -N;
  vec3 L1 = normalize(vec3(0.5, -0.6, 0.9)), L2 = normalize(vec3(-0.7, 0.5, 0.35));
  float d1 = max(dot(N, L1), 0.0), d2 = max(dot(N, L2), 0.0), hemi = 0.5 + 0.5 * N.z;
  vec3 base = uCol.rgb;
  float gloss = 26.0, spec = 0.16;
  if (uKind == 1) {                                     // compound eye: facets, and wet-looking
    vec3 q = vL * 2600.0;
    float f = sin(q.x) * sin(q.y + 0.5 * q.x) * sin(q.z);
    base *= 0.72 + 0.4 * smoothstep(-0.2, 0.6, f); gloss = 70.0; spec = 0.6;
  }
  if (uKind == 3) { gloss = 12.0; spec = 0.05; }        // bristles and dark parts: matt
  vec3 H = normalize(L1 + V);
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  vec3 c = base * (0.09 + 0.15 * hemi) + base * (0.95 * d1 * vec3(1.0, 0.94, 0.86) + 0.33 * d2 * vec3(0.55, 0.7, 1.0));
  c += spec * pow(max(dot(N, H), 0.0), gloss) * vec3(1.0, 0.96, 0.9) + rim * vec3(0.08, 0.13, 0.26);
  float a = 1.0;
  if (uKind == 2) {                                     // wing membrane: thin, with a soap-film sheen
    float t = 1.0 - max(dot(N, V), 0.0);
    vec3 film = 0.5 + 0.5 * cos(6.2832 * (t * 1.6 + vec3(0.0, 0.33, 0.67)));
    c = mix(vec3(0.42, 0.5, 0.6) * 0.4, film, 0.3) * (0.3 + 0.7 * d1 + 0.35 * rim) + 0.5 * pow(max(dot(N, H), 0.0), 90.0);
    a = 0.26 + 0.5 * t;
  }
  o = vec4(c, a);
}`;
const VS_G = `#version 300 es
uniform mat4 uVP; uniform vec3 uC; uniform float uS;
out vec2 vP;
const vec2 Q[6] = vec2[6](vec2(-1, -1), vec2(1, -1), vec2(1, 1), vec2(-1, -1), vec2(1, 1), vec2(-1, 1));
void main() { vP = Q[gl_VertexID] * uS; gl_Position = uVP * vec4(uC.xy + vP, uC.z, 1.0); }`;
const FS_G = `#version 300 es
precision highp float;
in vec2 vP; uniform float uS; uniform vec2 uFly; uniform vec2 uC2;
out vec4 o;
void main() {                                            // a lit patch of floor under the fly, its shadow, a faint grid
  float r = length(vP) / uS;
  float fade = exp(-r * r * 5.0);
  vec2 w = uC2 + vP;
  vec2 g = abs(fract(w / 0.05) - 0.5);
  float grid = smoothstep(0.47, 0.5, max(g.x, g.y));
  vec2 dsh = (w - uFly) / vec2(0.16, 0.16);
  float sh = exp(-dot(dsh, dsh));
  vec3 c = vec3(0.075, 0.085, 0.12) * (1.0 - 0.8 * sh) + grid * vec3(0.03, 0.04, 0.07);
  o = vec4(c * fade, 1.0);
}`;
const FS_O = `#version 300 es
precision mediump float;
in vec2 vUv; uniform sampler2D uTex; out vec4 o;
void main() { o = texture(uTex, vUv); }`;
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function attrib(prog, name, data, size, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, name);
  if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); }
  return b;
}

// ---- camera
const cam = { yaw: 0.5, pitch: 0.08, dist: 3.3, rotate: true };
function mvp(w, h) {
  const f = 1 / Math.tan(0.5 * 34 * Math.PI / 180), near = 0.1, far = 20;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  // view = T(0, 0, -dist) * Rx(pitch) * Ry(yaw); column-major
  const v = [cy, sp * sy, -cp * sy, 0, 0, cp, sp, 0, sy, -sp * cy, cp * cy, 0, 0, 0, -cam.dist, 1];
  const p = [f / (w / h), 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
  const m = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += p[k * 4 + r] * v[c * 4 + k];
    m[c * 4 + r] = s;
  }
  return m;
}
// the body's camera circles the fly (MuJoCo's world: z up)
const bcam = { yaw: 2.2, pitch: 0.3, dist: 0.85 };
function bodyVP(w, h, look, zoom) {
  const f = 1 / Math.tan(0.5 * 30 * Math.PI / 180), near = 0.01, far = 30;
  const dist = bcam.dist * Math.max(1, 1.3 / (w / h)) * (zoom || 1);   // a narrow picture: step back so the wings still fit; on the floor: wider (follow)
  const cp = Math.cos(bcam.pitch), eye = [look[0] + dist * cp * Math.cos(bcam.yaw), look[1] + dist * cp * Math.sin(bcam.yaw), look[2] + dist * Math.sin(bcam.pitch)];
  let z = [eye[0] - look[0], eye[1] - look[1], eye[2] - look[2]];
  const zl = Math.hypot(...z); z = z.map(v => v / zl);
  let x = [-z[1], z[0], 0];                                 // up (0, 0, 1) x z
  const xl = Math.hypot(...x); x = x.map(v => v / xl);
  const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const v = [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  const p = [f / (w / h), 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
  const m = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += p[k * 4 + r] * v[c * 4 + k];
    m[c * 4 + r] = s;
  }
  return [m, eye];
}
let drag = null, dragBody = false;
function overBody(e) {
  if (!body.ok) return false;
  const r = canvas.getBoundingClientRect(), nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  return view === "body" || (view === "both" && nx > 0.5) || (view === "stack" && ny > 0.5);
}
function rects(w, h) {                                        // [x, y, width, height] from the bottom left; stack: brain above the fly
  if (!body.ok || view === "brain") return { brain: [0, 0, w, h], fly: null };
  if (view === "both") { const bw = Math.floor(w / 2); return { brain: [0, 0, bw, h], fly: [bw, 0, w - bw, h] }; }
  if (view === "stack") { const fh = Math.floor(h / 2); return { brain: [0, fh, w, h - fh], fly: [0, 0, w, fh] }; }
  return { brain: null, fly: [0, 0, w, h] };
}
canvas.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; dragBody = overBody(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", () => { drag = null; });
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = (e.clientX - drag[0]) * 0.006, dy = (e.clientY - drag[1]) * 0.006;
  if (dragBody) { bcam.yaw -= dx; bcam.pitch = Math.max(-0.2, Math.min(1.45, bcam.pitch + dy)); }
  else { cam.yaw += dx; cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch + dy)); }
  drag = [e.clientX, e.clientY];
});
canvas.addEventListener("wheel", e => {
  const k = Math.exp(e.deltaY * 0.001);
  if (overBody(e)) bcam.dist = Math.max(0.25, Math.min(6, bcam.dist * k)); else cam.dist = Math.max(0.6, Math.min(9, cam.dist * k));
  e.preventDefault();
}, { passive: false });

// ---- state
let hdr = null, tProg = null, exposure = S.exposure, base;

function draw(t) {

// ---- the settings menu
const MENU = [
  ["Picture"],
  { k: "view", label: "Layout", key: "M", opts: [["brain", "brain only"], ["both", "brain and fly, side by side"], ["stack", "brain above fly (for videos)"], ["body", "fly only"]], needsBody: true },
  { k: "rotate", label: "Camera turns by itself", key: "R" },
  { k: "edges", label: "Connections", key: "E" },
  { k: "slow", label: "Slow wave through layers", key: "S" },

  { k: "wing", body: true, label: "Strength of the wings", min: 0, max: 1, step: 0.01, fmt: v => v.toFixed(2) },
  { k: "gain", body: true, label: "How hard firing drives a joint", min: 0.5, max: 12, step: 0.1, fmt: v => v.toFixed(1) },

function menuValue(it) {

function resetFly() {                                          // the body starts again in the mode it is in: asking the body server
